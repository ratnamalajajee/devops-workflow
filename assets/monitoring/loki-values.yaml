# Loki for EKS: one Loki pod (SingleBinary) with a 50 GiB disk, 30 days of logs.
# Chart: grafana/loki 6.55.0
#   helm upgrade --install loki grafana/loki --version 6.55.0 -n monitoring -f loki-values.yaml
# Grafana and Fluent Bit talk to the service loki-gateway.
#
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    retention_period: 720h
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp2                 # CHANGE: kubectl get storageclass
    size: 50Gi
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

gateway:
  enabled: true

test:
  enabled: false
lokiCanary:
  enabled: false
minio:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
