server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Guides change often; always revalidate
    location /content/ {
        add_header Cache-Control "no-cache";
    }

    # Multi-cloud runbook page; its step scripts open as text instead of downloading
    location /multicloud/ {
        types {
            text/html  html;
            text/plain sh env tf py md;
        }
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
